<ggc-home-example-format
  [title]="componentInfo.title"
  [pathModule]="urlComponentModule"
  [extraConfigLabel]="`DatasetTree Configuration (json)`"
  [urlTSDocs]="tsDocsUrl"
  pathKaartConfig="example-dataset-tree/kaartconfig.json"
  pathExtraConfig="example-dataset-tree/treeconfig.json"
>
  @if (componentInfo.tags && componentInfo.tags?.length > 0) {
    <div page-labels>
      @for (tag of componentInfo.tags; track tag) {
        <span class="badge rounded-pill tag-technical mx-1">{{
          tag.toLocaleLowerCase()
        }}</span>
      }
    </div>
  }

  <div page-introduction>
    <p>
      {{ componentInfo.introduction }}
    </p>
    <p>
      De kaartlagen kunnen in een platte lijst getoond worden door
      <code>[hideTree]="true"</code> toe te voegen aan ggc-dataset-tree.
    </p>
  </div>

  <div page-functionality>
    <div class="row">
      <!-- DOCS:START functionality -->
      <div class="col-xl-3 col-lg-4 col-md-5 col-sm-6">
        <div class="dataset-tree-container">
          <ggc-dataset-tree
            [themes]="datasetTreeConfig"
            [mapIndex]="mapIndex"
            [hideTree]="true"
          ></ggc-dataset-tree>
        </div>
      </div>
      <div class="col-xl-9 col-lg-8 col-md-7 col-sm-6">
        <div class="map-container">
          <ggc-map [webServices]="mapConfig" [mapIndex]="mapIndex"></ggc-map>
        </div>
      </div>
      <!-- DOCS:END functionality -->
    </div>
  </div>

  <div page-tips>
    <p></p>
  </div>
</ggc-home-example-format>
