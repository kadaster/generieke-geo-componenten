<div class="container-opdracht" style="display: flex">
  <label for="select-opdracht">Kies een opdracht:</label>

  <select
    #selectOpdracht
    name="opdrachten"
    id="select-opdracht"
    (change)="navigateTo(selectOpdracht.value)"
  >
    <option value="opdracht 1">Opdracht 1</option>
    <option value="opdracht 2">Opdracht 2</option>
    <option value="opdracht 3">Opdracht 3</option>
  </select>
</div>
