@if (
  featureInfoCollectionArrayInternal() &&
  featureInfoCollectionArrayInternal().length > 0
) {
  <div
    class="ggc-fi-tab"
    role="tablist"
    [attr.aria-labelledby]="ariaLabelledBy ? ariaLabelledBy : null"
    [attr.aria-label]="ariaLabelledBy ? null : ariaLabel"
  >
    @for (info of featureInfoCollectionArrayInternal(); track info) {
      <button
        [id]="'tab-' + info.layerId"
        role="tab"
        [attr.aria-controls]="'tabpanel-' + info.layerTitle"
        [attr.aria-selected]="info.layerId === selectedTab()"
        [ngClass]="{
          active: info.layerId === selectedTab(),
          inactive: info.layerId !== selectedTab()
        }"
        (click)="
          featureInfoCollectionArrayInternal().length > 1
            ? onTabClicked(info.layerId)
            : null
        "
      >
        <ng-container
          [ngTemplateOutlet]="
            tabComponent ? tabComponent : defaultValueTemplate
          "
          [ngTemplateOutletContext]="{
            layerTitle: info.layerTitle,
            active: info.layerId === selectedTab()
          }"
        ></ng-container>
        <ng-template #defaultValueTemplate>{{ info.layerTitle }}</ng-template>
      </button>
    }
  </div>
}
<div
  class="ggc-fi-tab-content"
  [attr.id]="'tabpanel-' + selectedTab()"
  role="tabpanel"
  [attr.aria-labelledby]="
    featureInfoCollectionArrayInternal() &&
    featureInfoCollectionArrayInternal().length > 0
      ? 'tab-' + selectedTab()
      : null
  "
  tabIndex="0"
>
  <ng-content></ng-content>
</div>
